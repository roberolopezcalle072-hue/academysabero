server {
    listen 80;
    listen [::]:80;
    server_name api.saberoconsulting.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; try_files $uri =404; }
    location / { return 308 https://api.saberoconsulting.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.saberoconsulting.com;

    ssl_certificate /etc/letsencrypt/live/api.saberoconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.saberoconsulting.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;
    limit_req_status 429;

    location / {
        limit_req zone=api_rate burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:3000;
    }
}
