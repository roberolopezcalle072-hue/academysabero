server {
    listen 80;
    listen [::]:80;
    server_name academy.saberoconsulting.com;
    access_log /var/log/nginx/sabero-academy.access.log academy_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://academy.saberoconsulting.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name academy.saberoconsulting.com;

    ssl_certificate /etc/letsencrypt/live/academy.saberoconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.saberoconsulting.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/sabero-academy/current/frontend/dist/client;
    access_log /var/log/nginx/sabero-academy.access.log academy_safe;
    error_log /var/log/nginx/sabero-academy.error.log warn;
    include /etc/nginx/snippets/academy-headers.conf;

    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;

    location ^~ /_astro/ {
        try_files $uri =404;
        include /etc/nginx/snippets/academy-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/(images|logos)/ {
        try_files $uri =404;
        expires 1d;
    }

    location = /_image { return 404; }

    location = /healthz {
        limit_req zone=academy_dynamic burst=15 nodelay;
        include /etc/nginx/snippets/academy-proxy.conf;
        proxy_pass http://127.0.0.1:3000/api/v1/health;
    }

    location ^~ /api/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_req zone=academy_dynamic burst=30 nodelay;
        include /etc/nginx/snippets/academy-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /auth/ {
        limit_req zone=academy_auth burst=15 nodelay;
        limit_req zone=academy_total burst=40 nodelay;
        # The access log uses $uri. Suppress raw query strings from OAuth error logs.
        error_log /dev/null crit;
        include /etc/nginx/snippets/academy-proxy.conf;
        proxy_pass http://127.0.0.1:4321;
    }

    location / {
        limit_req zone=academy_dynamic burst=30 nodelay;
        limit_req zone=academy_total burst=40 nodelay;
        include /etc/nginx/snippets/academy-proxy.conf;
        proxy_pass http://127.0.0.1:4321;
    }
}
